<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Calendar</h1>

    <div class="calendar-header">
        <button id="prev">Previous</button>
        <h2 id="monthYear"></h2>
        <button id="next">Next</button>
    </div>

    <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
    </div>

    <div id="calendar"></div>

    <script src="script.js"></script>

</body>
</html>
